<!DOCTYPE html>
<html lang="vi">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KidMath</title>
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <div class="container">
        <div id="menuScreen">

        <h1>🌈 Halyka</h1>

        <h2>Chúc bé học vui vẻ</h2>

        <button id="MathBtn">
           ▶Toán
        </button>

        <button id="VietnameseBtn">
            ▶Tiếng Việt
        </button>

        <button id="EngLishBtn">
           ▶Tiếng Anh
        </button>

        <p class="version">
            Version 1.1
        </p>
   </div>

    <div id="mathScreen">
        <h2>Chọn bài học</h2>
        <button id="phepcongBtn">＋  Phép cộng</button>
  
        <button id="backMathBtn">🔙Quay lại</button>
    </div>

    <div id="vietnameseScreen">
        <h2>Chọn bài hoc</h2>
        <button id="vietnameseReadBtn"> Tập đọc</button>
        <button id="vietnamesequizBtn">Luyện từ</button>
        <button id="backVietnameseBtn">🔙Quay lại</button>
    </div>

<!-- Màn hình câu hỏi -->
    <div id="questionScreen">
        <h2>Phép cộng</h2>
        <!-- Câu hỏi -->
        <h1 id="questionText"></h1>
        <!-- Khu vực đáp án -->
        <div id="answerArea">
            <button class="answerBtn"></button>
            <button class="answerBtn"></button>
            <button class="answerBtn"></button>
            <button class="answerBtn"></button>
        </div>
        <!-- Kết quả đúng/sai -->
        <h2 id="resultText"></h2>
        <!-- Sang câu tiếp theo -->
        <button id="nextBtn">
            ➡ Câu tiếp theo
        </button>
        <!-- Thoát khỏi bài -->
        <button id="exitBtn">
            🔙 Thoát
        </button>
</div>

<!-- Màn hình tập đọc -->
<div id="vietnameseTryreadScreen" style="display:none;">
    <h2>Tập đọc</h2>

    <div id="tryreadContent" class="tryread-box"></div>
    <button id="nextTryreadBtn">➡ Câu tiếp theo</button>
    <button id="exitTryreadBtn">🔙 Thoát</button>
</div>
<!-- Màn hình vietnamesequiz -->
<div id="vn-quiz" style="display:none;">
    <div id="vn-img" class="vn-icon"></div>
    <div id="vn-answers"></div>

    <h2 id="vn-result"></h2>   <!-- ← thêm dòng này -->

    <button id="vn-nextBtn">➡ Câu tiếp theo</button>
    <button id="vn-exitBtn">🔙 Thoát</button>
</div>

    <script src="js/app.js"></script>

    <script src="js/math/mathdata.js"></script>
    <script src="js/math/mathquiz.js"></script>

    <script src="js/vietnamese/vietnamesedata.js"></script>
    <script src="js/vietnamese/read.js"></script>
    <script src="js/vietnamese/vietnamesequiz.js"></script>

</body>
</html>
