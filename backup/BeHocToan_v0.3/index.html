<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KidMath</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">
        <div id="menuScreen">

        <h1>🌈 KidMath</h1>

        <h2>Bé Học Toán</h2>

        <p>Chào mừng bé!</p>

        <button id="startButton">
           ▶Bắt Đầu
        </button>

        <button id="settingButton">
            ⚙Cài Đặt
        </button>

        <button id="scoreButton">
           🏆Thành Tích
        </button>

        <p class="version">
            Version 0.3
        </p>
    </div>

    <div id="gameScreen">
        <h2>Chọn phép tính</h2>
        <button>＋  Phép cộng</button>
        <button>－  Phép trừ</button>
        <button>×  Phép nhân</button>
        <button>÷ Phép chia</button>

        <button id="backBtn">🔙Quay lại</button>
    </div>

    <script src="js/app.js"></script>

</body>

</html>
